worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 2g;
  client_body_timeout 60s;
  client_header_timeout 15s;

  types {
    application/octet-stream nes sfc smc gb gbc gba md gen cue chd z64 n64 v64 cdi gdi pbp elf lst;
  }

  # Standalone deployments bind the container to loopback and place a host
  # reverse proxy in front of it. Trust only private/local proxy hops so
  # $remote_addr, access logs and backend rate limits use the actual client IP.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Real-IP;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=admin_api:10m rate=5r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream retro_backend {
    server backend:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: blob:; worker-src 'self' blob:; media-src 'self' blob:" always;

    location ~ /\. {
      deny all;
    }

    location = /healthz {
      proxy_pass http://retro_backend;
    }

    location ^~ /api/admin/ {
      limit_req zone=admin_api burst=20 nodelay;
      proxy_request_buffering off;
      proxy_pass http://retro_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 10m;
      proxy_send_timeout 10m;
    }

    location /api/ {
      limit_req zone=public_api burst=60 nodelay;
      proxy_pass http://retro_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      proxy_pass http://retro_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    location = /admin.html {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      try_files /admin.html =404;
    }

    location /roms/ {
      alias /srv/roms/;
      autoindex off;
      limit_except GET HEAD { deny all; }
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /bios/ {
      alias /srv/bios/;
      autoindex off;
      limit_except GET HEAD { deny all; }
      expires 7d;
      add_header Cache-Control "private, max-age=604800" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # loader.js is the bootstrap file. Do not make transient 4xx/5xx responses
    # sticky in browsers for a month; the large runtime assets remain immutable.
    location = /emulatorjs/data/loader.js {
      alias /srv/emulatorjs/data/loader.js;
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /emulatorjs/ {
      alias /srv/emulatorjs/;
      autoindex off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
