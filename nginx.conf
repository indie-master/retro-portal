worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  types {
    application/octet-stream nes sfc smc gb gbc gba md gen cue chd z64 n64 v64 cdi gdi iso elf lst;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream retro_backend {
    server backend:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enables SharedArrayBuffer / threaded EmulatorJS cores when every resource is same-origin.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
      proxy_pass http://retro_backend;
    }

    location /api/ {
      proxy_pass http://retro_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      proxy_pass http://retro_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    location /roms/ {
      alias /srv/roms/;
      autoindex off;
      limit_except GET HEAD { deny all; }
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /bios/ {
      alias /srv/bios/;
      autoindex off;
      limit_except GET HEAD { deny all; }
      expires 7d;
      add_header Cache-Control "private, max-age=604800" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /emulatorjs/ {
      alias /srv/emulatorjs/;
      autoindex off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
