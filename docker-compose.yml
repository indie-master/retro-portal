services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      CATALOG_FILE: /data/games.json
      ROM_ROOT: /roms
      BIOS_ROOT: /bios
    volumes:
      - ./catalog:/data:ro
      - ./games/roms:/roms:ro
      - ./games/bios:/bios:ro
    expose:
      - "3000"

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8088}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./games/roms:/srv/roms:ro
      - ./games/bios:/srv/bios:ro
      - ./emulatorjs:/srv/emulatorjs:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
