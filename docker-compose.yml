services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      PORT: "3000"
      CATALOG_FILE: /data/runtime-games.json
      CATALOG_TEMPLATE_FILE: /data/games.json
      PRESET_FILE: /data/presets/curated-classics.json
      STATS_FILE: /data/stats.json
      ROM_ROOT: /roms
      BIOS_ROOT: /bios
      COVER_ROOT: /covers
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      THEGAMESDB_API_KEY: "${THEGAMESDB_API_KEY:-}"
      WIKIPEDIA_METADATA: "${WIKIPEDIA_METADATA:-1}"
      ALLOW_ZIP_ROMS: "${ALLOW_ZIP_ROMS:-0}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-2147483648}"
    volumes:
      - ./catalog:/data
      - ./games/roms:/roms
      - ./games/bios:/bios
      - ./public/covers/library:/covers
    expose:
      - "3000"

  metadata:
    build:
      context: ./backend
    command: ["node", "metadata-worker.js"]
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      BACKEND_URL: http://backend:3000
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      ADMIN_TOKEN_FILE: /data/admin-token
      THEGAMESDB_API_KEY: "${THEGAMESDB_API_KEY:-}"
      WIKIPEDIA_METADATA: "${WIKIPEDIA_METADATA:-1}"
      AUTO_METADATA: "${AUTO_METADATA:-1}"
      AUTO_METADATA_OVERWRITE: "${AUTO_METADATA_OVERWRITE:-0}"
      AUTO_METADATA_INTERVAL: "${AUTO_METADATA_INTERVAL:-600}"
      AUTO_METADATA_BATCH: "${AUTO_METADATA_BATCH:-8}"
    volumes:
      - ./catalog:/data:ro
    depends_on:
      - backend

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=32m,mode=1777
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8088}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./games/roms:/srv/roms:ro
      - ./games/bios:/srv/bios:ro
      - ./emulatorjs:/srv/emulatorjs:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
