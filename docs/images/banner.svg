    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102c36"/><stop offset="1" stop-color="#173126"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1030" cy="190" r="210" fill="#d58d3a" opacity=".08"/>
  <g transform="translate(90 92)">
    <g fill="#a9d56f"><rect x="0" y="0" width="12" height="12"/><rect x="24" y="0" width="12" height="12"/><rect x="-12" y="12" width="60" height="12"/><rect x="0" y="24" width="12" height="12"/><rect x="24" y="24" width="12" height="12"/></g>
    <text x="72" y="31" fill="#f3ead9" font-family="Verdana,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="3">RETRO</text>
    <text x="208" y="31" fill="#f4b85d" font-family="Verdana,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="3">PORTAL</text>
