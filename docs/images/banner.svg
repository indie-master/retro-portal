    <text x="0" y="168" fill="#f4b85d" font-family="Verdana,Arial,sans-serif" font-size="62" font-weight="900">Прямо в браузере.</text>
    <text x="3" y="222" fill="#a7b3b3" font-family="Verdana,Arial,sans-serif" font-size="20">Self-hosted · EmulatorJS · ROM library · WebSocket presence</text>
