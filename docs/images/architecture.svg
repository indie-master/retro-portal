<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Retro Portal architecture</title>
  <desc id="desc">Browser connects through Nginx to a Docker-hosted web frontend and Node backend. EmulatorJS runs in the browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a0f"/><stop offset="1" stop-color="#0d141d"/></linearGradient>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#f4f7fb}.m{font-family:Inter,Arial,sans-serif;fill:#8c98a8}.g{fill:#7cff4f}.c{fill:#5ce1ff}.box{fill:#0c1118;stroke:#2b3544;stroke-width:2}.arrow{stroke:#5ce1ff;stroke-width:3;fill:none;marker-end:url(#a)}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5ce1ff"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" class="t" font-size="30" font-weight="800">RETRO PORTAL</text><text x="60" y="104" class="m" font-size="16">self-hosted browser arcade architecture</text>
  <rect x="60" y="170" width="250" height="230" rx="20" class="box"/><text x="90" y="215" class="g" font-size="15" font-weight="800">BROWSER</text><text x="90" y="258" class="t" font-size="22" font-weight="700">Portal UI</text><text x="90" y="294" class="m" font-size="15">HTML / CSS / JS</text><text x="90" y="330" class="t" font-size="22" font-weight="700">EmulatorJS</text><text x="90" y="366" class="m" font-size="15">WASM emulation runs here</text>
  <rect x="475" y="150" width="250" height="270" rx="20" class="box"/><text x="505" y="195" class="c" font-size="15" font-weight="800">HOST NGINX</text><text x="505" y="240" class="t" font-size="22" font-weight="700">TLS / reverse proxy</text><text x="505" y="278" class="m" font-size="15">standard :443</text><text x="505" y="307" class="m" font-size="15">or stream + ssl_preread</text><text x="505" y="350" class="t" font-size="18" font-weight="700">127.0.0.1:8088</text><text x="505" y="382" class="m" font-size="14">private app listener</text>
  <rect x="890" y="115" width="250" height="150" rx="20" class="box"/><text x="920" y="158" class="g" font-size="15" font-weight="800">WEB CONTAINER</text><text x="920" y="198" class="t" font-size="20" font-weight="700">Static portal</text><text x="920" y="230" class="m" font-size="14">ROM / covers / WASM</text>
  <rect x="890" y="305" width="250" height="150" rx="20" class="box"/><text x="920" y="348" class="c" font-size="15" font-weight="800">BACKEND</text><text x="920" y="388" class="t" font-size="20" font-weight="700">Catalog + WebSocket</text><text x="920" y="420" class="m" font-size="14">presence / heartbeat</text>
  <path d="M310 285 H475" class="arrow"/><path d="M725 235 H890" class="arrow"/><path d="M725 350 H890" class="arrow"/>
</svg>