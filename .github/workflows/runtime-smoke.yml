name: Runtime Static Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  emulatorjs-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate runtime installer and updater contracts
        run: |
          grep -q 'find "$DEST/data" -type d -exec chmod 0755' scripts/install-emulatorjs.sh
          grep -q 'find "$DEST/data" -type f -exec chmod 0644' scripts/install-emulatorjs.sh
          grep -q 'mobile disc extension requires the pinned 4.2.3' scripts/install-emulatorjs.sh
          grep -q 'location \^~ /emulatorjs/' nginx.conf
          grep -q 'force-recreate.*FRONTEND_SERVICE' scripts/update.sh

      - name: Start portal with runtime fixture
        run: |
          mkdir -p emulatorjs/data
          printf 'window.__retroRuntimeSmoke = true;\n    const config = {};\n' > emulatorjs/data/loader.js
          chmod 0755 emulatorjs emulatorjs/data
          chmod 0644 emulatorjs/data/loader.js

          cat >.env <<EOF
          PORT=18091
          BIND_ADDR=127.0.0.1
          PUID=$(id -u)
          PGID=$(id -g)
          ADMIN_TOKEN=
          THEGAMESDB_API_KEY=
          WIKIPEDIA_METADATA=0
          AUTO_METADATA=0
          ALLOW_ZIP_ROMS=0
          MAX_UPLOAD_BYTES=2147483648
          EOF

          docker compose up -d --build
          trap 'docker compose logs --tail=120 || true; docker compose down -v || true' EXIT

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:18091/healthz >/dev/null && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:18091/healthz >/dev/null
          curl -fsS http://127.0.0.1:18091/emulatorjs/data/loader.js | grep -q '__retroRuntimeSmoke'
          curl -fsS http://127.0.0.1:18091/emulatorjs-mobile-loader.js | grep -q 'mobileDiscStream'
          curl -fsS http://127.0.0.1:18091/mobile-disc-stream.js | grep -q 'CHUNK_BYTES'

          curl -fsSI http://127.0.0.1:18091/game.js | tr -d '\r' | grep -qi '^cache-control: .*no-cache'
          curl -fsSI http://127.0.0.1:18091/styles.css | tr -d '\r' | grep -qi '^cache-control: .*no-cache'
          curl -fsSI http://127.0.0.1:18091/roms/tank-battle.bin | tr -d '\r' | grep -qi '^accept-ranges: bytes'
          test "$(curl -sS -o /tmp/rom-range.bin -w '%{http_code}' -H 'Range: bytes=0-3' http://127.0.0.1:18091/roms/tank-battle.bin)" = '206'
          test "$(wc -c </tmp/rom-range.bin)" = '4'

          # Replace the config inode, as a Git checkout does, then verify the
          # updater remounts it and preserves backend catalog/auth state.
          CATALOG_BEFORE="$(sha256sum catalog/runtime-games.json)"
          TOKEN_BEFORE="$(sha256sum catalog/admin-token)"
          WEB_BEFORE="$(docker compose ps -q web)"
          python3 - <<'PYTEST'
          from pathlib import Path
          config = Path('nginx.conf')
          replacement = Path('nginx.conf.next')
          replacement.write_text(config.read_text().replace('server_name _;', 'server_name _;\n    location = /__release_smoke { return 200 "release-config-loaded"; }'))
          replacement.replace(config)
          PYTEST
          bash scripts/update.sh --mode standalone --no-git --yes
          test "$(sha256sum catalog/runtime-games.json)" = "$CATALOG_BEFORE"
          test "$(sha256sum catalog/admin-token)" = "$TOKEN_BEFORE"
          test "$(docker compose ps -q web)" != "$WEB_BEFORE"
          test "$(curl -fsS http://127.0.0.1:18091/__release_smoke)" = 'release-config-loaded'

          NGINX_TEST="$(docker compose exec -T web nginx -t 2>&1)"
          printf '%s\n' "$NGINX_TEST"
          if grep -q 'duplicate extension "iso"' <<<"$NGINX_TEST"; then
            echo 'Unexpected duplicate ISO MIME warning' >&2
            exit 1
          fi
