name: Refresh UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'public/**'
      - 'catalog/**'
      - 'backend/**'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare demo ROMs
        run: ./scripts/install-homebrew-roms.sh
      - name: Start Retro Portal
        run: |
          cat >.env <<EOF
          PORT=8088
          BIND_ADDR=127.0.0.1
          PUID=$(id -u)
          PGID=$(id -g)
          ADMIN_TOKEN=
          THEGAMESDB_API_KEY=
          WIKIPEDIA_METADATA=0
          ALLOW_ZIP_ROMS=0
          MAX_UPLOAD_BYTES=2147483648
          EOF
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8088/healthz >/dev/null && break
            sleep 2
          done
          curl -fSI http://127.0.0.1:8088/ >/dev/null
          curl -fSI http://127.0.0.1:8088/local.html >/dev/null
          curl -fSI http://127.0.0.1:8088/admin.html >/dev/null
          curl -fsS http://127.0.0.1:8088/api/games >/dev/null
          test -s catalog/admin-token
      - name: Install Playwright
        run: |
          npm --prefix /tmp/shot init -y
          npm --prefix /tmp/shot install playwright@1.55.0
          cd /tmp/shot && npx playwright install --with-deps chromium
      - name: Capture real pages
        run: |
          mkdir -p docs/images
          cat >/tmp/shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 1440, height: 1600 }, deviceScaleFactor: 1 });
          for (const [url, out] of [
            ['http://127.0.0.1:8088/', 'home.png'],
            ['http://127.0.0.1:8088/local.html', 'local-rom.png']
          ]) {
            const response = await page.goto(url, {waitUntil:'networkidle'});
            if (!response || !response.ok()) throw new Error(`${url} returned ${response?.status()}`);
            await page.screenshot({path: process.env.GITHUB_WORKSPACE + '/docs/images/' + out, fullPage:true});
          }

          const adminResponse = await page.goto('http://127.0.0.1:8088/admin.html', {waitUntil:'networkidle'});
          if (!adminResponse || !adminResponse.ok()) throw new Error(`admin returned ${adminResponse?.status()}`);
          await page.locator('#adminToken').fill(process.env.RETRO_ADMIN_TOKEN || '');
          await page.locator('#connectAdmin').click();
          await page.locator('#adminApp').waitFor({state:'visible', timeout:10000});
          await page.screenshot({path: process.env.GITHUB_WORKSPACE + '/docs/images/admin.png', fullPage:true});
          await browser.close();
          EOF
          cd /tmp/shot && RETRO_ADMIN_TOKEN="$(cat "$GITHUB_WORKSPACE/catalog/admin-token")" node capture.mjs
      - name: Verify screenshot assets
        run: |
          test -s docs/images/home.png
          test -s docs/images/local-rom.png
          test -s docs/images/admin.png
      - name: Commit screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/images/home.png docs/images/local-rom.png docs/images/admin.png
          git diff --cached --quiet && exit 0
          git commit -m 'docs: refresh UI screenshots'
          git push
