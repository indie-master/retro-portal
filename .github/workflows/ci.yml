name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
          sh -n edge/entrypoint.sh
      - name: Quick installer contract
        run: |
          test -x scripts/quick-install.sh
          ./scripts/quick-install.sh --quick-help >/dev/null
          grep -q '/opt/retro-portal' README.md
          grep -q '/opt/retro-portal' README_EN.md
          grep -q '/opt/retro-portal' docs/ru/INSTALL.md
          grep -q '/opt/retro-portal' docs/en/INSTALL.md
      - name: JavaScript syntax
        run: |
          for file in backend/*.js public/*.js pages/*.js; do node --check "$file"; done
      - name: JSON and catalog
        run: |
          python3 -m json.tool catalog/games.json >/dev/null
          python3 -m json.tool catalog/presets/curated-classics.json >/dev/null
          python3 scripts/catalog-check.py
      - name: Library manager, scaling and controls files
        run: |
          test -s public/admin.html
          test -s public/admin.js
          test -s public/admin.css
          test -s public/controls.js
          test -s public/styles-controls.css
          test -s public/styles-activity.css
          test -s docs/ru/LIBRARY.md
          test -s docs/en/LIBRARY.md
          test -s docs/ru/NETWORKING.md
          test -s docs/en/NETWORKING.md
          test -s docs/ru/SCALING.md
          test -s docs/en/SCALING.md
          test -s docs/ru/UPDATE.md
          test -s docs/en/UPDATE.md
          test -s docker-compose.edge.yml
          test -s .env.edge.example
          test -s cluster/nodes.example
          test -s SECURITY.md
          grep -q '^catalog/admin-token$' .gitignore
          grep -q '^catalog/runtime-games.json$' .gitignore
          grep -q '^catalog/stats.json$' .gitignore
          grep -q '^catalog/activity.json$' .gitignore
          grep -q '^catalog/metadata-proposals.json$' .gitignore
          grep -q '^cluster/nodes.conf$' .gitignore
      - name: Public demo copy
        run: |
          grep -q 'renderDemoActivity' pages/app.js
          ! grep -RqiE 'без backend|не рисуем фальшив|фальшивый онлайн|Xray XHTTP|provider-facing|provider/CDN support' README.md README_EN.md CHANGELOG.md docs pages public
      - name: Docker Compose
        run: |
          docker compose config >/dev/null
          CONTROL_ORIGIN_HOST=example.com docker compose --env-file .env.edge.example -f docker-compose.edge.yml config >/dev/null
      - name: Nginx syntax
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/public:/usr/share/nginx/html:ro" \
            -v "$PWD/games/roms:/srv/roms:ro" \
            -v "$PWD/games/bios:/srv/bios:ro" \
            -v "$PWD/emulatorjs:/srv/emulatorjs:ro" \
            nginx:1.29-alpine nginx -t
      - name: Edge runtime hardening and health
        run: |
          export CONTROL_ORIGIN_HOST=example.com EDGE_PORT=18089 EDGE_BIND_ADDR=127.0.0.1
          docker compose --env-file .env.edge.example -f docker-compose.edge.yml up -d --build
          trap 'docker compose --env-file .env.edge.example -f docker-compose.edge.yml logs --tail=120 || true; docker compose --env-file .env.edge.example -f docker-compose.edge.yml down -v || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18089/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18089/healthz >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18089/admin.html)" = "404"
          docker inspect retro-portal-edge-edge-1 --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{json .HostConfig.CapDrop}}' | tee /tmp/edge-inspect.txt
          grep -q '^nginx true' /tmp/edge-inspect.txt
      - name: Runtime library manager integration
        run: |
          cat >.env <<EOF
          PORT=18088
          BIND_ADDR=127.0.0.1
          PUID=$(id -u)
          PGID=$(id -g)
          ADMIN_TOKEN=
          THEGAMESDB_API_KEY=
          WIKIPEDIA_METADATA=0
          ALLOW_ZIP_ROMS=0
          MAX_UPLOAD_BYTES=2147483648
          EOF
          docker compose up -d --build
          trap 'docker compose logs --tail=160 || true; docker compose down -v || true' EXIT
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:18088/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18088/healthz >/dev/null
          test -s catalog/admin-token
          TOKEN="$(cat catalog/admin-token)"
          test "${#TOKEN}" -ge 32
          curl -fsS http://127.0.0.1:18088/api/games > /tmp/public-games.json
          curl -fsS http://127.0.0.1:18088/api/activity > /tmp/activity.json
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18088/api/admin/status > /tmp/admin-status.json
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18088/api/admin/games > /tmp/admin-games.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/api/admin/status)" = "401"
          python3 - <<'PY'
          import json
          public=json.load(open('/tmp/public-games.json'))['games']
          admin=json.load(open('/tmp/admin-games.json'))['games']
          status=json.load(open('/tmp/admin-status.json'))
          activity=json.load(open('/tmp/activity.json'))
          assert all(g.get('playable') for g in public), 'public API exposed a non-playable title'
          assert len(admin) >= len(public), 'admin catalog should be at least as large as public catalog'
          assert status.get('ok') is True
          assert 'systems' in status and 'summary' in status and 'security' in status
          assert activity.get('real') is True
          assert isinstance(activity.get('popular7d'), list)
          PY
      - name: README local links and required assets
        run: |
          test -s docs/images/home.png
          test -s docs/images/local-rom.png
          test -s docs/images/admin.png
          python3 - <<'PY'
          import pathlib,re,sys
          roots=[pathlib.Path('README.md'),pathlib.Path('README_EN.md')]
          broken=[]
          for md in roots:
              text=md.read_text(encoding='utf-8')
              for target in re.findall(r'!?(?:\[[^\]]*\])\(([^)]+)\)',text):
                  target=target.split('#',1)[0].strip()
                  if not target or '://' in target or target.startswith('mailto:') or target.startswith('#'):
                      continue
                  p=(md.parent/target).resolve()
                  if not p.exists(): broken.append(f'{md}: {target}')
          if broken:
              print('Broken local links:',*broken,sep='\n- ')
              sys.exit(1)
          PY
