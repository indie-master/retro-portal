name: Build GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static playable demo
        run: |
          set -euxo pipefail
          mkdir -p _site/roms _site/covers _site/assets
          cp public/index.html public/game.html public/local.html public/styles.css public/styles-base.css public/styles-library.css public/styles-local.css public/styles-responsive.css public/styles-art.css _site/
          cp -a public/covers/. _site/covers/
          cp -a public/assets/. _site/assets/
          cp pages/app.js _site/app.js
          cp pages/game.js _site/game.js
          cp pages/local.js _site/local.js
          cp pages/presence.js _site/presence.js
          cp games/roms/tank-battle.bin games/roms/battle-4tris.bin games/roms/pong.bin games/roms/snake-arena.bin games/roms/space-shooter.bin games/roms/breakout.bin _site/roms/
          sed -i -e 's|href="/|href="|g' -e 's|src="/|src="|g' _site/*.html
          sed -i -e "s|url('/|url('|g" _site/*.css
          touch _site/.nojekyll
          cat > _site/README.txt <<'EOF'
          Retro Portal GitHub Pages demo.
          EmulatorJS runtime is loaded from the official stable CDN in the demo build.
          The six included ROMs are MIT-licensed homebrew titles.
          EOF
      - name: Publish gh-pages branch
        run: |
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: GitHub Pages demo'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
