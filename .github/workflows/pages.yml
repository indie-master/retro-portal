name: Build GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build static playable demo
        run: |
          set -euxo pipefail
          mkdir -p _site/roms _site/covers _site/assets _site/screenshots
          cp public/index.html public/game.html public/local.html \
             public/styles.css public/styles-base.css public/styles-library.css public/styles-local.css \
             public/styles-responsive.css public/styles-art.css public/styles-v060.css \
             public/styles-controls.css public/styles-activity.css public/controls.js _site/
          cp -a public/covers/. _site/covers/
          cp -a public/assets/. _site/assets/
          if [ -d public/screenshots ]; then cp -a public/screenshots/. _site/screenshots/; fi
          cp pages/app.js _site/app.js
          cp pages/game.js _site/game.js
          cp pages/local.js _site/local.js
          cp pages/presence.js _site/presence.js
          cp games/roms/tank-battle.bin games/roms/battle-4tris.bin games/roms/pong.bin games/roms/snake-arena.bin games/roms/space-shooter.bin games/roms/breakout.bin _site/roms/
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          data = json.loads((root/'catalog/games.json').read_text())
          out = []
          for game in data.get('games', []):
              is_demo = bool(game.get('demo') or 'homebrew' in game.get('tags', []))
              if not is_demo:
                  continue
              g = dict(game)
              installed = (root/'games/roms'/g.get('rom','')).is_file()
              if not installed:
                  continue
              g['demo'] = True
              g['installed'] = True
              g['biosRequired'] = False
              g['biosInstalled'] = True
              g['experimental'] = False
              g['playable'] = True
              g['romUrl'] = f"roms/{g['rom']}"
              if g.get('cover'): g['cover'] = g['cover'].lstrip('/')
              g['screenshots'] = [s.lstrip('/') for s in g.get('screenshots', [])]
              out.append(g)
          pathlib.Path('_site/catalog.json').write_text(json.dumps({'games':out},ensure_ascii=False,indent=2)+'\n')
          PY
          sed -i -e 's|href="/|href="|g' -e 's|src="/|src="|g' _site/*.html
          sed -i -e "s|url('/|url('|g" _site/*.css
          touch _site/.nojekyll
          cat > _site/README.txt <<'EOF'
          Retro Portal GitHub Pages demo.
          Only games that are actually playable in the public demo are displayed.
          The included demo ROMs are redistributable homebrew titles.
          EmulatorJS runtime is loaded from the official stable CDN only in the GitHub Pages build.
          Activity widgets use representative demo data so the complete interface can be previewed.
          EOF
      - name: Validate static demo assets
        run: |
          test -s _site/index.html
          test -s _site/game.html
          test -s _site/controls.js
          test -s _site/styles-controls.css
          test -s _site/styles-activity.css
          test -s _site/catalog.json
          node --check _site/app.js
          node --check _site/game.js
          node --check _site/controls.js
          grep -q 'renderDemoActivity' _site/app.js
          ! grep -RqiE 'без backend|фальшив(ый|ого).*онлайн' _site
      - name: Publish gh-pages branch
        run: |
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: GitHub Pages demo'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
