name: Build GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static playable demo
        run: |
          set -euxo pipefail
          mkdir -p _site/roms _site/covers _site/assets _site/screenshots
          cp public/index.html public/game.html public/local.html public/styles.css public/styles-base.css public/styles-library.css public/styles-local.css public/styles-responsive.css public/styles-art.css public/styles-v060.css _site/
          cp -a public/covers/. _site/covers/
          cp -a public/assets/. _site/assets/
          if [ -d public/screenshots ]; then cp -a public/screenshots/. _site/screenshots/; fi
          cp pages/app.js _site/app.js
          cp pages/game.js _site/game.js
          cp pages/local.js _site/local.js
          cp pages/presence.js _site/presence.js
          cp -a games/roms/. _site/roms/
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          data = json.loads((root/'catalog/games.json').read_text())
          out = []
          for game in data.get('games', []):
              g = dict(game)
              bios = g.get('bios', [])
              if isinstance(bios, str): bios = [bios]
              installed = (root/'games/roms'/g.get('rom','')).is_file()
              bios_installed = all((root/'games/bios'/b).is_file() for b in bios)
              experimental = g.get('engine') == 'flycast-wasm' or bool(g.get('experimental'))
              g['demo'] = bool(g.get('demo') or 'homebrew' in g.get('tags', []))
              g['installed'] = installed
              g['biosRequired'] = bool(bios)
              g['biosInstalled'] = bios_installed
              g['experimental'] = experimental
              g['playable'] = installed and bios_installed and not experimental
              g['romExpected'] = g.get('rom','')
              g['biosExpected'] = bios
              g['romUrl'] = f"roms/{g['rom']}" if installed else None
              if g.get('cover'): g['cover'] = g['cover'].lstrip('/')
              g['screenshots'] = [s.lstrip('/') for s in g.get('screenshots', [])]
              out.append(g)
          pathlib.Path('_site/catalog.json').write_text(json.dumps({'games':out},ensure_ascii=False,indent=2)+'\n')
          PY
          sed -i -e 's|href="/|href="|g' -e 's|src="/|src="|g' _site/*.html
          sed -i -e "s|url('/|url('|g" _site/*.css
          touch _site/.nojekyll
          cat > _site/README.txt <<'EOF'
          Retro Portal GitHub Pages demo.
          The public demo shows the complete classics catalog as installable cards and runs six MIT-licensed homebrew ROMs.
          EmulatorJS runtime is loaded from the official stable CDN only in the GitHub Pages build.
          EOF
      - name: Publish gh-pages branch
        run: |
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: GitHub Pages demo'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
